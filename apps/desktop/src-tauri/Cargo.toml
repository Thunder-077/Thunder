[package]
name = "thunder-desktop"
version = "0.1.1"
description = "Thunder desktop shell"
authors = ["Thunder"]
edition = "2021"

[lib]
name = "thunder_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-decorum = "1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sherpa-onnx = "1.13.2"
bzip2 = "0.4"
tar = "0.4"
ureq = "2.12.1"

[profile.release]
opt-level = 3
codegen-units = 16
lto = "thin"
panic = "abort"
strip = true

